genericDevicePlugin:
  enabled: true
  image:
    repository: "squat/generic-device-plugin"
    tag: "latest"
    pullPolicy: "IfNotPresent"
  device:
    count: 6
  resources:
    requests:
      cpu: "100m"
      memory: "50Mi"
    limits:
      cpu: "150m"
      memory: "100Mi"

