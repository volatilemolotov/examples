ollama:
  enabled: true
  ollama:
    models:
      pull:
        - gemma3
        - llama3.2
  resources:
    requests:
      cpu: 1
      memory: 4Gi
      squat.ai/dri: "1"
    limits:
      cpu: 4
      memory: 8Gi
      squat.ai/dri: "1"
  
  persistentVolume:
    enabled: true
    existingClaim: "ai-starter-kit-models-cache-pvc"
    subPath: "ollama"

ramalama:
  enabled: true
  command:
    - /bin/sh
    - -c
    - ramalama pull qwen2.5:1.5b && ramalama serve qwen2.5:1.5b --port 8080 --device metal
  
  resources:
    requests:
      cpu: 1
      memory: 2Gi
      squat.ai/dri: "1"
    limits:
      cpu: 4
      memory: 8Gi
      squat.ai/dri: "1"
  
  extraVolumeMounts:
    - name: dev-dri
      mountPath: /dev/dri
  
  extraVolumes:
    - name: dev-dri
      hostPath:
        path: /dev/dri

modelsCachePvc:
  enabled: true
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  size: 40Gi 

localPersistence:
  enabled: true
  hostPath: "/home/models-cache"